name: Inference Platform CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment (dev requires its existing readiness gates)
        type: choice
        options: [staging, dev]
        default: staging
        required: true

permissions:
  contents: read

concurrency:
  group: inference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: synthx_test
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: synthx_platform_ci
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U synthx_test -d synthx_platform_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: python -m pip install -r requirements-ci.txt
      - name: Platform and deployment regressions, including isolated SQL recovery
        env:
          SYNTHX_TEST_DATABASE_URL: postgresql://synthx_test:ci-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/synthx_platform_ci?sslmode=disable
        run: python deploy/ci/run_tests.py
      - name: Export the dependency versions exercised by tests
        run: python -m pip freeze > .ci-constraints.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-constraints-${{ github.sha }}
          path: .ci-constraints.txt
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  image:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: tested-constraints-${{ github.sha }}
      - name: Build the tested linux/amd64 platform image
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 --build-arg "REVISION=$REVISION" \
            --tag "synthx-platform:$REVISION" --file deploy/ci/Dockerfile.platform .
      - name: Smoke the built CPU API and text adapter imports
        env:
          REVISION: ${{ github.sha }}
        run: python3 deploy/ci/smoke_image.py "synthx-platform:$REVISION"
      - name: Export immutable deployment image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          REVISION: ${{ github.sha }}
        run: |
          mkdir image-artifact
          docker save "synthx-platform:$REVISION" | gzip -1 > image-artifact/platform-image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: platform-image-${{ github.sha }}
          path: image-artifact/platform-image.tar.gz
          retention-days: 3
          if-no-files-found: error

  deploy:
    # Main pushes deploy only staging. Dev is a deliberate manual operation.
    if: >-
      github.ref == 'refs/heads/main' && (
        ((github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')) &&
         vars.INFERENCE_STAGING_DEPLOY_ENABLED == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.target == 'dev' &&
         vars.INFERENCE_DEPLOY_ENABLED == 'true' &&
         vars.INFERENCE_TEXT_V123_CUTOVER_READY == 'true'))
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: inference-${{ inputs.target || 'staging' }}-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: platform-image-${{ github.sha }}
          path: image-artifact
      - name: Send image through the dedicated restricted platform key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.INFERENCE_EC2_DEPLOY_KEY }}
          DEPLOY_TARGET: ${{ inputs.target || 'staging' }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$DEPLOY_TARGET" in
            staging) command=deploy-platform-staging ;;
            dev) command=deploy-platform ;;
            *) echo 'Invalid deployment target'; exit 1 ;;
          esac
          test -n "$SSH_PRIVATE_KEY" || { echo 'Configure INFERENCE_EC2_DEPLOY_KEY after rollout approval.'; exit 1; }
          key="$RUNNER_TEMP/inference-deploy-key"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          unset SSH_PRIVATE_KEY
          digest=$(sha256sum image-artifact/platform-image.tar.gz | cut -d ' ' -f 1)
          for attempt in 1 2 3; do
            set +e
            ssh -T -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/ci/ec2_known_hosts \
              -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ubuntu@3.129.244.17 "$command $REVISION $digest" < image-artifact/platform-image.tar.gz
            result=$?
            set -e
            if test "$result" -eq 0; then exit 0; fi
            if test "$result" -ne 75 || test "$attempt" -eq 3; then exit "$result"; fi
            echo 'Backend or platform busy; retrying deployment in 30 seconds.'
            sleep 30
          done

  release-status:
    name: Deployment result
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, image, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Require verified deployment of this main revision
        env:
          REVISION: ${{ github.sha }}
          DEPLOY_TARGET: ${{ inputs.target || 'staging' }}
          TEST_RESULT: ${{ needs.test.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          STAGING_DEPLOY_ENABLED: ${{ vars.INFERENCE_STAGING_DEPLOY_ENABLED }}
          DEV_DEPLOY_ENABLED: ${{ vars.INFERENCE_DEPLOY_ENABLED }}
          DEV_CUTOVER_READY: ${{ vars.INFERENCE_TEXT_V123_CUTOVER_READY }}
        run: python3 deploy/ci/release_status.py
